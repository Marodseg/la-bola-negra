name: Guardar histórico

# Cada noche guarda en el repositorio una copia pública de todas las actas (CSV y JSON).
on:
  schedule:
    - cron: '40 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: historico
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Averiguar la URL de la API
        id: api
        env:
          API_URL: ${{ vars.API_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Si no hay variable API_URL, se calcula con el subdominio workers.dev de la cuenta.
          if [ -z "$API_URL" ] && [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            sub=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain // empty') || true
            [ -n "$sub" ] && API_URL="https://la-bola-negra-api.$sub.workers.dev"
          fi
          if [ -z "$API_URL" ]; then
            echo "::warning::No se conoce la URL de la API (ni variable API_URL ni secretos de Cloudflare). Mira docs/despliegue.md"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "API: $API_URL"
            echo "url=${API_URL%/}" >> "$GITHUB_OUTPUT"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.api.outputs.ready == 'true'
      - name: Descargar actas
        if: steps.api.outputs.ready == 'true'
        env:
          API_URL: ${{ steps.api.outputs.url }}
        run: |
          mkdir -p historico
          curl --fail --silent --show-error --retry 3 "$API_URL/api/historico.csv" -o historico/historico.csv
          curl --fail --silent --show-error --retry 3 "$API_URL/api/historico.json" -o historico/historico.json
      - name: Guardar cambios
        if: steps.api.outputs.ready == 'true'
        run: |
          git add historico
          if git diff --cached --quiet; then
            echo "Sin cambios en el histórico."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Histórico: actas hasta $(date -u +%F)"
          git push
