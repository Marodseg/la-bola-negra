name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, tests y compilación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Comprobar que el Worker empaqueta
        run: npx wrangler deploy --config worker/wrangler.toml --dry-run --outdir .wrangler/dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'
      - name: Auditoría de dependencias de producción
        run: npm audit --omit=dev --audit-level=high
