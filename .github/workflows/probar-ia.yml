name: Probar IA

# Comprueba a mano que el modelo de Workers AI responde y que sus preguntas pasan los filtros.
on:
  workflow_dispatch:
    inputs:
      corrector:
        description: 'Modelo corrector (vacío = el de wrangler.toml)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Generar preguntas de prueba
        run: node scripts/probar-ia.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RONDAS: '5'
          AI_REVIEW_MODEL: ${{ inputs.corrector }}
