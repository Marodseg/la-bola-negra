name: Desplegar web (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'vite.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.api.outputs.ready }}
    steps:
      - name: Averiguar la URL de la API
        id: api
        env:
          API_URL: ${{ vars.API_URL }}
          SITE_URL: ${{ vars.SITE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Si no hay variable API_URL, se calcula con el subdominio workers.dev de la cuenta.
          if [ -z "$API_URL" ] && [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            sub=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain // empty') || true
            [ -n "$sub" ] && API_URL="https://la-bola-negra-api.$sub.workers.dev"
          fi
          if [ -z "$API_URL" ]; then
            echo "::warning::No se conoce la URL de la API (ni variable API_URL ni secretos de Cloudflare). Mira docs/despliegue.md"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "API: $API_URL"
            echo "url=${API_URL%/}" >> "$GITHUB_OUTPUT"
            site="${SITE_URL:-https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}}"
            echo "site=${site%/}" >> "$GITHUB_OUTPUT"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.api.outputs.ready == 'true'
      - uses: actions/setup-node@v7
        if: steps.api.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        if: steps.api.outputs.ready == 'true'
      - run: npm run build
        if: steps.api.outputs.ready == 'true'
        env:
          VITE_API_URL: ${{ steps.api.outputs.url }}
          VITE_SITE_URL: ${{ steps.api.outputs.site }}
      - uses: actions/configure-pages@v6
        if: steps.api.outputs.ready == 'true'
      - uses: actions/upload-pages-artifact@v5
        if: steps.api.outputs.ready == 'true'
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
